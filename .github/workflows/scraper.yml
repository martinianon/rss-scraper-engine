name: Generador Automático Multisitio de Feeds RSS

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta cada 1 hora
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas necesarias
        run: |
          pip install requests beautifulsoup4

      - name: Ejecutar script unificado
        run: python generate_feed.py

      - name: Guardar todos los feeds (.xml) en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ls *.xml 1> /dev/null 2>&1; then
            git add *.xml
            git commit -m "bot: Actualización automática de feeds RSS" || exit 0
            git push
          fi
